services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-agrichain-docker-dev}
      FRONTEND_URL: http://127.0.0.1:8080
      CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      BLOCKCHAIN_MODE: python
    volumes:
      - agrichain-data:/data
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  agrichain-data:
